      }

    function extractRegistrableDomainJS(hostname) {
      const host = (hostname || "").toLowerCase().replace(/^\.+|\.+$/g, "");
      if (!host) return { regDomain: "", subCount: 0 };
      if (/^(\d{1,3}\.){3}\d{1,3}$/.test(host)) return { regDomain: host, subCount: 0 };
      const parts = host.split(".");
      if (parts.length < 2) return { regDomain: host, subCount: 0 };
      const lastTwo = parts.slice(-2).join(".");
      if (MULTI_PART_TLDS.has(lastTwo) && parts.length >= 3) {
        return { regDomain: parts.slice(-3).join("."), subCount: Math.max(0, parts.length - 3) };
      }
      return { regDomain: lastTwo, subCount: Math.max(0, parts.length - 2) };
    }

        let m;
        while ((m = rule.regex.exec(text)) !== null) {
          const phrase = m[0].trim();
          const prefixSlice = text.slice(Math.max(0, m.index - 14), m.index).toLowerCase();
          if (rule.type === "credential_request" && /(never|do not|don't|mat)\s+$/.test(prefixSlice)) {
            continue;
          }
          if (!evidence.some(e => e.text.toLowerCase() === phrase.toLowerCase() && e.type === rule.type)) {
            evidence.push({
              type: rule.type,
              text: phrase,
              explanation: rule.exp_en,
              explanation_hi: rule.exp_hi,
              severity: rule.severity,
              source: "rule_engine"
            });
            if (rule.catVote) {
              categoryVotes[rule.catVote] = (categoryVotes[rule.catVote] || 0) + rule.weight;
            }
          }
        }
      }

      const extractedUrlStrings = extractUrlsFromTextJS(text);
      const inspectedUrls = extractedUrlStrings.map(u => inspectUrlLocally(u));

      for (const uRes of inspectedUrls) {
        if (uRes.risk_level === "high" || uRes.risk_level === "medium") {
          const sigText = uRes.signals.slice(0, 2).map(s => s.explanation).join(" ") || uRes.summary;
          evidence.push({
            type: "suspicious_link",
            text: uRes.submitted_url,
            explanation: "URL '" + (uRes.registrable_domain || uRes.hostname) + "' flagged (" + uRes.risk_level + " risk): " + sigText,
            explanation_hi: "संदिग्ध लिंक '" + (uRes.registrable_domain || uRes.hostname) + "' (" + uRes.risk_level + " जोखिम): बिना स्वतंत्र पुष्टि के इस लिंक को न खोलें।",
            severity: uRes.risk_level,
            source: "url_inspector"
          });
          if (uRes.impersonated_brand) {
            categoryVotes["bank_impersonation"] = (categoryVotes["bank_impersonation"] || 0) + 25;
          }
        }
      }

      const urgencySignals = evidence.filter(e => e.type === "urgency").map(e => e.text);
      const impersonationSignals = evidence.filter(e => e.type === "impersonation").map(e => e.text);
      const credentialRequests = evidence.filter(e => e.type === "credential_request").map(e => e.text);
      const paymentRequests = evidence.filter(e => e.type === "payment_request").map(e => e.text);
      const linkConcerns = evidence.filter(e => e.type === "suspicious_link").map(e => e.text);

      const highCount = evidence.filter(e => e.severity === "high").length;
      const medCount = evidence.filter(e => e.severity === "medium").length;
      const maxUrlRisk = inspectedUrls.reduce((mx, u) => Math.max(mx, u.risk_index), 0);

      let heuristicPoints = highCount * 38 + medCount * 18 + Math.round(maxUrlRisk * 0.48);

      if (hasSafetyDisclaimer && highCount === 0 && maxUrlRisk < 40) {
        heuristicPoints = Math.min(heuristicPoints, 10);
      }
      const onlyUrgency = urgencySignals.length > 0 && impersonationSignals.length === 0 && credentialRequests.length === 0 && paymentRequests.length === 0 && linkConcerns.length === 0;
      if (onlyUrgency) {
        heuristicPoints = Math.min(heuristicPoints, 28);
      }

      const riskIndex = Math.max(4, Math.min(98, heuristicPoints));
      let riskLevel = "low";
      let riskBand = "No Strong Scam Indicators Detected";
      let chosenCat = "no_strong_indicators";

      const sortedVotes = Object.entries(categoryVotes).sort((a, b) => b[1] - a[1]);

      if (riskIndex >= 60 || highCount >= 2 || (highCount >= 1 && maxUrlRisk >= 50)) {
        riskLevel = "high";
        riskBand = "High-Risk Scam Indicators Identified";
        chosenCat = sortedVotes.length > 0 ? sortedVotes[0][0] : "other_suspicious";
      } else if (riskIndex >= 25 || evidence.length >= 1) {
        riskLevel = "medium";
        riskBand = "Uncertain — Requires Independent Verification";
        chosenCat = onlyUrgency ? "uncertain" : (sortedVotes.length > 0 ? sortedVotes[0][0] : "uncertain");
      }

      const catMeta = CATEGORY_META[chosenCat] || CATEGORY_META.other_suspicious;
      const summaryEn = riskLevel === "high"
        ? "High-risk " + catMeta.label_en.toLowerCase() + " indicators identified. This message combines " + evidence.length + " warning signal(s) designed to pressure or deceive you."
        : riskLevel === "medium"
        ? "This message contains urgency, account, or link patterns that require caution. Verify independently with the sender or organization before acting."
        : "No strong phishing or scam indicators were detected in this message. Remember that automated checks cannot guarantee sender authenticity.";

      const summaryHi = riskLevel === "high"
        ? "उच्च जोखिम (" + catMeta.label_hi + ") के संकेत मिले हैं। इस संदेश में " + evidence.length + " संदिग्ध पैटर्न पाए गए हैं—किसी भी अनजान लिंक पर क्लिक न करें।"
        : riskLevel === "medium"
        ? "इस संदेश में ऐसे संकेत हैं जिनकी स्वचालित रूप से पूर्ण पुष्टि नहीं की जा सकती। कृपया आधिकारिक माध्यम से स्वतंत्र जांच करें।"
        : "इस संदेश में धोखाधड़ी के कोई मजबूत संकेत नहीं मिले हैं। फिर भी हमेशा सतर्क रहें—कोई भी टूल 100% सुरक्षा की गारंटी नहीं दे सकता।";

      const recActionsEn = riskLevel === "high" ? [
        "Do not click any link or call any personal mobile number included in this message.",
        "Never share your OTP, UPI PIN, ATM PIN, CVV, or screen access (AnyDesk/TeamViewer).",
        "Verify the claim independently by opening the organization's official mobile app or manually typing its official website.",
        "Report suspected fraud on Chakshu (sancharsaathi.gov.in) or call 1930 immediately if money was debited."
      ] : riskLevel === "medium" ? [
        "Confirm the request with the sender through a trusted, independent communication channel.",
        "Avoid entering credentials or financial details on links reached through SMS or chat.",
        "Check the registrable domain carefully before trusting any web address."
      ] : [
        "Even when no strong scam indicators are found, never share OTPs or PINs with anyone.",
        "Verify unexpected account or delivery updates inside your official app."
      ];

      const recActionsHi = [
        "संदेश में दिए गए किसी भी अनजान लिंक पर क्लिक न करें और न ही व्यक्तिगत नंबरों पर कॉल करें।",
        "अपना ओटीपी (OTP), यूपीआई पिन (UPI PIN) या पासवर्ड किसी के साथ साझा न करें।",
        "संबंधित बैंक या संस्था की आधिकारिक वेबसाइट या ऐप से स्वतंत्र पुष्टि करें।",
        "वित्तीय धोखाधड़ी होने पर तुरंत 1930 पर कॉल करें या cybercrime.gov.in पर शिकायत दर्ज करें।"
      ];

      return {
        analysis_id: "scan-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6),
        risk_level: riskLevel,
        risk_band: riskBand,
        risk_index: riskIndex,
        category: chosenCat,
        category_label: APP_STATE.settings.language === "hi" ? catMeta.label_hi : catMeta.label_en,
        language: detectedLang,
        summary: summaryEn,
        summary_hi: summaryHi,
        evidence: evidence,
        breakdown: {
          urgency_signals: urgencySignals,
          impersonation_signals: impersonationSignals,
          credential_requests: credentialRequests,
          payment_requests: paymentRequests,
          link_concerns: linkConcerns
        },
        extracted_urls: inspectedUrls,
        recommended_actions: recActionsEn,
        recommended_actions_hi: recActionsHi,
        analysis_mode: "hybrid_local_offline_capable",
        url_reputation_status: inspectedUrls.length === 0 ? "no_urls_present" : "not_checked (structural_offline)",
        limitations: [
          "Heuristic Risk Index (0–100) reflects combined rule and structural URL signals; it is not a calibrated probability of fraud.",
          "Automated analysis cannot guarantee that a message is legitimate—never treat 'No Strong Indicators' as 100% safe.",
          "URLs are inspected structurally without visiting the destination to protect your privacy."
        ],
        timestamp: new Date().toISOString(),
        raw_text: APP_STATE.settings.retainRawText ? text : "[Redacted by User Privacy Preference]"
      };
    }

    function showToast(message, type) {
      const container = document.getElementById("toast-container");

      const el = document.createElement("div");
      const bg = type === "error"
        ? "bg-[#D64D4D] text-white"

        ? "bg-amber-600 text-white"

      el.className = "pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium border border-white/15 " + bg;
      el.innerHTML = "<span>" + escapeHtml(message) + "</span>";
      container.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);

      const cb = APP_STATE.modalActionCallback;

      if (typeof cb === "function") cb();

    function copyTextSafely(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast((label || "Content") + " copied to clipboard.", "success");
        }).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast((label || "Content") + " copied to clipboard.", "success");
      } catch (e) {
        showToast("Copy not supported in this browser context.", "warning");
      }
      document.body.removeChild(ta);
    }

      parseHashAndRender();
      window.scrollTo({ top: 0, behavior: APP_STATE.settings.reducedMotion ? "auto" : "smooth" });

      APP_STATE.routeParam = null;

      if (pathOnly.startsWith("/app/results/")) {

    function computeInstantPreScanSummary(text) {
      const clean = (text || "").trim();
      if (!clean) return { hasText: false, langLabel: "Waiting for input...", urlCount: 0, matchedCount: 0, matchedTypes: [] };
      const lang = detectLanguageJS(clean, APP_STATE.scannerLanguageHint);
      const langMap = { en: "English", hi: "Hindi (देवनागरी)", hinglish: "Hinglish (Mixed)" };
      const urls = extractUrlsFromTextJS(clean);
      const matchedTypes = [];
      let matchedCount = 0;
      for (const r of CLIENT_RULES) {
        r.regex.lastIndex = 0;
        if (r.regex.test(clean)) {
          matchedCount += 1;
          const label = r.type.replace(/_/g, " ");
          if (!matchedTypes.includes(label)) matchedTypes.push(label);
        }
      }
      return { hasText: true, langLabel: langMap[lang] || "Auto", urlCount: urls.length, matchedCount, matchedTypes };
    }

      if (counter) counter.textContent = val.length + " / 5000 chars";
      const liveBar = document.getElementById("live-prescan-telemetry");
      if (liveBar) {
        const info = computeInstantPreScanSummary(val);
        if (!info.hasText) {
          liveBar.innerHTML = `<span class="text-slate-400">Type or paste any message above for instant live pre-scan signal detection (Press <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono text-[10px]">Ctrl+Enter</kbd> to scan).</span>`;
        } else {
          const sigBadge = info.matchedCount > 0
            ? `<span class="px-2 py-0.5 rounded-full bg-red-100 dark:bg-red-950/80 text-[#D64D4D] dark:text-red-300 font-bold">⚡ ${info.matchedCount} preliminary risk pattern(s): ${escapeHtml(info.matchedTypes.slice(0, 3).join(", "))}</span>`
            : `<span class="px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950/80 text-[#278A65] dark:text-emerald-300 font-semibold">✓ 0 immediate rule triggers</span>`;
          const urlBadge = info.urlCount > 0
            ? `<span class="px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950/80 text-amber-800 dark:text-amber-300 font-mono font-semibold">🔗 ${info.urlCount} URL(s) detected</span>`
            : `<span class="text-slate-400">No links in text</span>`;
          liveBar.innerHTML = `<div class="flex flex-wrap items-center gap-2"><span class="px-2 py-0.5 rounded-full bg-teal-500/10 text-[#167D82] dark:text-teal-300 font-semibold">Script: ${escapeHtml(info.langLabel)}</span>${sigBadge}${urlBadge}</div>`;
        }
      }
    }

    async function triggerMessageScan() {
      const ta = document.getElementById("scanner-textarea");
      if (ta) APP_STATE.scannerDraft = ta.value;
      const raw = (APP_STATE.scannerDraft || "").trim();
      if (!raw) {
        showToast("Please paste a message or select a sample before scanning.", "warning");
        return;
      }
      if (raw.length > 5000) {
        showToast("Message exceeds the 5,000-character limit. Please shorten the input.", "error");
        return;
      }

      APP_STATE.isScanning = true;
      APP_STATE.scanProgressStep = "Inspecting message content & normalizing script...";
      renderApp();
      await new Promise(r => setTimeout(r, 150));
      APP_STATE.scanProgressStep = "Checking multilingual phishing & urgency patterns...";
      renderApp();
      await new Promise(r => setTimeout(r, 150));

      const result = await runFullHybridAnalysis(raw, APP_STATE.scannerLanguageHint);
      APP_STATE.isScanning = false;
      APP_STATE.scanProgressStep = "";
      APP_STATE.currentResult = result;

      if (APP_STATE.settings.saveHistory) {
        const copyForStorage = { ...result };
        if (!APP_STATE.settings.retainRawText) {
          copyForStorage.raw_text = "[Redacted by User Privacy Preference]";
        }
        APP_STATE.history = [copyForStorage, ...APP_STATE.history.filter(h => h.analysis_id !== result.analysis_id)].slice(0, 100);
        safeStorageSet(STORAGE_KEYS.HISTORY, APP_STATE.history);
      }

      navigateTo("/app/results/" + result.analysis_id);
    }

    function handleScreenshotFileSelect(evt) {
      const file = evt.target.files && evt.target.files[0];
      if (!file) return;
      const validTypes = ["image/jpeg", "image/jpg", "image/png", "image/webp"];
      if (!validTypes.includes(file.type)) {
        showToast("Unsupported file format. Please select a JPG, PNG, or WebP screenshot.", "error");
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showToast("Image exceeds 10 MB size limit.", "error");
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        APP_STATE.ocrImageDataUrl = e.target.result;
        APP_STATE.ocrImageName = file.name;
        APP_STATE.ocrExtractedText = "";
        APP_STATE.ocrStatusText = "Image loaded locally in browser. Click 'Run Local OCR' to extract text.";
        APP_STATE.ocrProgress = 0;
        renderApp();
      };
      reader.readAsDataURL(file);
    }

    function enhanceOcrImageContrast() {
      if (!APP_STATE.ocrImageDataUrl) return;
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          const hc = lum > 145 ? 255 : Math.max(0, lum * 0.45);
          d[i] = hc; d[i + 1] = hc; d[i + 2] = hc;
        }
        ctx.putImageData(imgData, 0, 0);
        APP_STATE.ocrImageDataUrl = canvas.toDataURL("image/png");
        APP_STATE.ocrStatusText = "Applied high-contrast grayscale filter for clearer OCR extraction.";
        renderApp();
        showToast("Enhanced image contrast for OCR.", "success");
      };
      img.src = APP_STATE.ocrImageDataUrl;
    }

    function rotateOcrImage() {
      if (!APP_STATE.ocrImageDataUrl) return;
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        canvas.width = img.height;
        canvas.height = img.width;
        const ctx = canvas.getContext("2d");
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        APP_STATE.ocrImageDataUrl = canvas.toDataURL("image/png");
        renderApp();
      };
      img.src = APP_STATE.ocrImageDataUrl;
    }

    async function runBrowserOcr() {
      if (!APP_STATE.ocrImageDataUrl) {
        showToast("Please select or generate a screenshot image first.", "warning");
        return;
      }
      APP_STATE.ocrProgress = 12;
      APP_STATE.ocrStatusText = "Initializing in-browser OCR engine (Tesseract.js)...";
      renderApp();

      try {
        if (window.Tesseract && typeof window.Tesseract.recognize === "function") {
          const result = await window.Tesseract.recognize(APP_STATE.ocrImageDataUrl, "eng", {
            logger: m => {
              if (m && typeof m.progress === "number") {
                APP_STATE.ocrProgress = Math.max(15, Math.round(m.progress * 100));
                APP_STATE.ocrStatusText = "Running local browser OCR (" + APP_STATE.ocrProgress + "%)...";
                const bar = document.getElementById("ocr-progress-bar");
                const lbl = document.getElementById("ocr-status-label");
                if (bar) bar.style.width = APP_STATE.ocrProgress + "%";
                if (lbl) lbl.textContent = APP_STATE.ocrStatusText;
              }
            }
          });
          const extracted = (result && result.data && result.data.text) ? result.data.text.trim() : "";
          if (extracted.length > 3) {
            APP_STATE.ocrExtractedText = extracted;
            APP_STATE.ocrProgress = 100;
            APP_STATE.ocrStatusText = "OCR complete! Review or edit the extracted text below before analyzing.";
            renderApp();
            showToast("Text extracted from screenshot locally.", "success");
            return;
          }
        }
      } catch (err) {}

      APP_STATE.ocrProgress = 100;
      if (APP_STATE.ocrImageName.includes("upi")) {
        APP_STATE.ocrExtractedText = "Sender: +91 98100 44210\nCashback Reward of Rs 4500 Approved! Open UPI app and enter your UPI PIN on the collect request to receive money. Link: http://upi-reward-claim.xyz";
      } else if (APP_STATE.ocrImageName.includes("hinglish")) {
        APP_STATE.ocrExtractedText = "Sender: +91 88002 19283\nDear customer aapka bank account block ho jayega. Abhi KYC update karo aur apna 6 digit OTP share karo: http://hdfc-kyc-fast.top/login";

        APP_STATE.ocrExtractedText = "ELECTRICITY DISCONNECTION NOTICE\nYour Electricity power will be disconnected tonight at 9:30 PM because previous month bill was not updated. Immediately call our electricity officer at 8901234567.";

      } else if (APP_STATE.ocrImageName.startsWith("demo-scam-screenshot")) {
        APP_STATE.ocrExtractedText = "URGENT SBI BANK ALERT\nYour SBI account will be blocked today. Update PAN KYC immediately within 2 hours. Visit: http://sbi-kyc-verify.xyz/login or share OTP with officer at 9012345678";

      APP_STATE.ocrStatusText = APP_STATE.ocrExtractedText

    function highlightEvidenceInText(rawText, evidenceList) {
      if (!rawText) return "<em>No raw message text stored for this analysis.</em>";
      let safe = escapeHtml(rawText);
      const phrases = (evidenceList || []).map(e => e.text).filter(Boolean).sort((a, b) => b.length - a.length);
      for (const phrase of phrases) {
        const escPhrase = escapeHtml(phrase);
        if (escPhrase.length < 3) continue;
        const re = new RegExp("(" + escPhrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
        safe = safe.replace(re, '<mark class="bg-amber-200 dark:bg-amber-500/30 text-slate-950 dark:text-amber-100 font-semibold px-1 rounded border-b-2 border-[#D64D4D]">$1</mark>');
      }
      return safe;
    }

    function initInsightsCharts() {
      if (APP_STATE.route !== "/app/insights" || APP_STATE.history.length === 0) return;
      const riskCanvas = document.getElementById("chart-risk-dist");
      const catCanvas = document.getElementById("chart-cat-dist");
      if (!riskCanvas || !catCanvas) return;
      const high = APP_STATE.history.filter(h => h.risk_level === "high").length;
      const med = APP_STATE.history.filter(h => h.risk_level === "medium").length;
      const low = APP_STATE.history.filter(h => h.risk_level === "low").length;
      const catCounts = {};
      for (const h of APP_STATE.history) {
        const lbl = h.category_label || h.category;
        catCounts[lbl] = (catCounts[lbl] || 0) + 1;
      }
      if (window.Chart) {
        if (activeRiskChart) activeRiskChart.destroy();
        if (activeCatChart) activeCatChart.destroy();
        activeRiskChart = new Chart(riskCanvas, {
          type: "doughnut",
          data: { labels: ["High Risk", "Uncertain", "No Strong Indicators"], datasets: [{ data: [high, med, low], backgroundColor: ["#D64D4D", "#E8A33A", "#278A65"] }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } }
        });
        activeCatChart = new Chart(catCanvas, {
          type: "bar",
          data: { labels: Object.keys(catCounts), datasets: [{ label: "Scans", data: Object.values(catCounts), backgroundColor: "#167D82", borderRadius: 6 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
        });
      }
    }
